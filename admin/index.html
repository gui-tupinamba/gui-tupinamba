<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Painel administrativo de confirmações" />

    <title>Confirmações</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="pagina">
      <div class="card">
        <!-- =====================================
                 LOGIN
            ====================================== -->

        <section id="login" class="tela-login">
          <header class="cabecalho">
            <div class="icone-evento">💍</div>

            <h1>Confirmações</h1>

            <p>Painel de administração</p>
          </header>

          <div class="campo">
            <label for="usuario"> Usuário </label>

            <input
              type="text"
              id="usuario"
              placeholder="Digite o usuário"
              autocomplete="username"
              spellcheck="false"
            />
          </div>

          <div class="campo">
            <label for="senha"> Senha </label>

            <input
              type="password"
              id="senha"
              placeholder="Digite a senha"
              autocomplete="current-password"
            />
          </div>

          <button type="button" id="btnEntrar" class="btn-confirmar">
            Entrar
          </button>

          <div id="erroLogin" class="mensagem erro"></div>

          <footer>
            <a href="../mywedding/" class="link-voltar">
              Voltar para confirmação
            </a>
          </footer>
        </section>

        <!-- =====================================
                 PAINEL
            ====================================== -->

        <section id="painel" class="painel" style="display: none">
          <header class="cabecalho">
            <div class="icone-evento">💍</div>

            <h1>Confirmações</h1>

            <p>Painel de administração</p>
          </header>

          <!-- =================================
                     ESTATÍSTICAS
                ================================== -->

          <div class="estatisticas">
            <div class="estatistica">
              <strong id="totalPessoas"> 0 </strong>

              <span> Pessoas </span>
            </div>

            <div class="estatistica">
              <strong id="totalTitulares"> 0 </strong>

              <span> Titulares </span>
            </div>

            <div class="estatistica">
              <strong id="totalAcompanhantes"> 0 </strong>

              <span> Acompanhantes </span>
            </div>
          </div>

          <!-- =================================
                     CONSULTA
                ================================== -->

          <div class="consulta">
            <div class="titulo-consulta">
              <label for="busca"> Consultar convidado </label>
            </div>

            <input
              type="text"
              id="busca"
              placeholder="Digite o nome..."
              autocomplete="off"
            />

            <div class="barra-acoes">
              <span id="resultado" class="contador-resultados">
                0 convites
              </span>

              <button type="button" id="btnAtualizar" class="btn-atualizar">
                ↻ Atualizar
              </button>
            </div>
          </div>

          <!-- =================================
                     CARREGANDO
                ================================== -->

          <div id="carregando" class="carregando">
            <div class="spinner"></div>

            <span> Carregando... </span>
          </div>

          <!-- =================================
                     LISTA
                ================================== -->

          <div id="lista" class="lista-convidados"></div>

          <!-- =================================
                     SAIR
                ================================== -->

          <button type="button" id="btnSair" class="btn-sair">Sair</button>

          <footer>
            <span> Painel administrativo </span>
          </footer>
        </section>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
