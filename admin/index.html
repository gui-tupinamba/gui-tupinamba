<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Administração - Confirmações</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="pagina">
      <section class="card">
        <!-- =====================================
                 CABEÇALHO
            ====================================== -->

        <header class="cabecalho">
          <div class="icone-evento">💍</div>

          <h1>Confirmações</h1>

          <p>Painel de administração</p>
        </header>

        <!-- =====================================
                 LOGIN
            ====================================== -->

        <div id="login" class="login">
          <div class="campo">
            <label for="senha"> Senha de acesso </label>

            <input
              type="password"
              id="senha"
              placeholder="Digite a senha"
              autocomplete="current-password"
            />
          </div>

          <button type="button" id="btnEntrar" class="btn-confirmar">
            Entrar
          </button>

          <div id="erroLogin" class="mensagem erro"></div>
        </div>

        <!-- =====================================
                 PAINEL
            ====================================== -->

        <div id="painel" class="painel" style="display: none">
          <!-- =================================
                     ESTATÍSTICAS
                ================================== -->

          <div class="estatisticas">
            <div class="estatistica">
              <span class="numero" id="totalPessoas"> 0 </span>

              <span class="descricao"> Pessoas </span>
            </div>

            <div class="estatistica">
              <span class="numero" id="totalTitulares"> 0 </span>

              <span class="descricao"> Titulares </span>
            </div>

            <div class="estatistica">
              <span class="numero" id="totalAcompanhantes"> 0 </span>

              <span class="descricao"> Acompanhantes </span>
            </div>
          </div>

          <!-- =================================
                     BUSCA
                ================================== -->

          <div class="campo busca">
            <label for="busca"> Consultar convidado </label>

            <input type="search" id="busca" placeholder="Digite o nome..." />
          </div>

          <!-- =================================
                     STATUS
                ================================== -->

          <div class="barra-acoes">
            <span id="resultado"> Carregando... </span>

            <button type="button" id="btnAtualizar" class="btn-atualizar">
              ↻ Atualizar
            </button>
          </div>

          <!-- =================================
                     LISTA
                ================================== -->

          <div id="lista" class="lista"></div>

          <!-- =================================
                     CARREGANDO
                ================================== -->

          <div id="carregando" class="carregando">
            <div class="spinner"></div>

            <span> Carregando confirmações... </span>
          </div>

          <!-- =================================
                     SAIR
                ================================== -->

          <button type="button" id="btnSair" class="btn-sair">Sair</button>
        </div>

        <!-- =====================================
                 RODAPÉ
            ====================================== -->

        <footer>Painel administrativo</footer>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
