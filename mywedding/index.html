<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Confirmação de presença" />

    <title>Confirmação de Presença</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="pagina">
      <section class="card">
        <!-- CABEÇALHO -->

        <header class="cabecalho">
          <img class="icone-evento" src="iandshe.jpeg">

          <h1>Ketlen e Guilherme</h1>
          <h2>Confirmação de Presença</h2>

          <p>Confirme sua presença e informe seus acompanhantes. Máximo 3 Acompanhantes</p>
        </header>

        <!-- FORMULÁRIO -->

        <form id="formulario" method="POST" target="iframeEnvio">
          <!-- NOME -->

          <div class="campo">
            <label for="nome"> Seu nome completo </label>

            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Digite seu nome completo"
              autocomplete="name"
              required
            />
          </div>

          <!-- ACOMPANHANTES -->

          <div class="secao-acompanhantes">
            <div class="titulo-secao">
              <div>
                <h2>Acompanhantes</h2>

                <span> Adicione quem irá com você. </span>
              </div>

              <span id="contador" class="contador"> 0 </span>
            </div>

            <!-- LISTA -->

            <div id="listaAcompanhantes" class="lista-acompanhantes"></div>

            <!-- BOTÃO ADICIONAR -->

            <button type="button" id="btnAdicionar" class="btn-adicionar">
              <span> + </span>

              Adicionar acompanhante
            </button>
          </div>

          <!-- BOTÃO CONFIRMAR -->

          <button type="submit" id="btnConfirmar" class="btn-confirmar">
            Confirmar presença
          </button>

          <!-- CARREGANDO -->

          <div id="carregando" class="carregando">
            <div class="spinner"></div>

            <span> Enviando confirmação... </span>
          </div>
        </form>

        <!-- MENSAGEM -->

        <div id="mensagem" class="mensagem"></div>

        <!-- RODAPÉ -->

        <footer>Sua confirmação será registrada para o evento.</footer>
        <a href="../admin/" class="link-admin">Área administrativa</a>
      </section>
    </main>

    <!--
        IFRAME INVISÍVEL

        O formulário envia os dados para o
        Google Apps Script sem sair da página.
    -->

    <iframe name="iframeEnvio" id="iframeEnvio" class="iframe-escondido">
    </iframe>

    <script src="script.js"></script>
  </body>
</html>
